name: Publish stable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          test "${GITHUB_REF_NAME#v}" = "$version"
          test -s "dist/DriveGauge-${version}-arm64.dmg"
          test -s "dist/DriveGauge-stable.dmg"
          test -s updates/appcast.xml
          hdiutil verify "dist/DriveGauge-${version}-arm64.dmg"
          hdiutil verify "dist/DriveGauge-stable.dmg"
          grep -Fq "sparkle:edSignature=" updates/appcast.xml
          grep -Fq "DriveGauge-stable.dmg" updates/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/DriveGauge-${version}-arm64.dmg" \
            "dist/DriveGauge-stable.dmg" \
            --title "DriveGauge ${version}" \
            --notes-file updates/release-notes.md \
            --latest
